[project]
name = "backend"
version = "0.1.0"
description = "Backend dependencies for the VKCA App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pgvector>=0.4.2",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "ipython>=9.15.0",
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]
test = [
    "pytest>=9.1.1",
]

[bandit.toml]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]