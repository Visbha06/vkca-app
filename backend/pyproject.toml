[project]
name = "backend"
version = "0.1.0"
description = "Backend dependencies for the VKCA App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Async PostgreSQL API stack required by the cricket backend service.
    "alembic>=1.18.5",
    # Argon2id password hashing; the standard library has no password KDF API.
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    # ARQ provides the Redis-backed async worker runtime; application-owned
    # code remains responsible for durable state and processing policy.
    "arq==0.28.0",
    "fastapi>=0.139.0",
    # Official Gemini embedding SDK; isolates provider protocol work from raw HTTP.
    "google-genai==1.45.0",
    "pgvector>=0.4.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Signed JWT support with cryptographic algorithms not provided by stdlib.
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    # Local quality, async API testing, and dependency-isolation tooling.
    "bandit[toml]>=1.9.4",
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
]

[bandit.toml]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["src/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # google-genai 1.45.0 declares Metric.validate_name as a classmethod;
    # upstream releases use the Pydantic 2.12-compatible instance method.
    "ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated.*:pydantic.warnings.PydanticDeprecatedSince212:google\\.genai\\.types",
]
